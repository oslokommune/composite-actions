name: "Evaluate automerge"
description: "Evaluate whether Renovate upgrades to golden-path-boilerplate are safe to automerge"

inputs:
  rules:
    description: "JSON array of automerge rules. Each rule: {pattern, major?, minor?, patch?}. Policies name the highest change severity they tolerate: 'never' < 'no-changes' < 'additive' < 'no-destroy' < 'any-changes'. First matching pattern wins. Unspecified types default to 'no-changes'."
    required: true
  stack-severities:
    description: "JSON object mapping stack paths to change severities ('no-changes', 'additive', 'no-destroy', 'any-changes' or 'unknown'), limited to stacks whose plan succeeded. 'unknown' blocks automerge."
    required: true

outputs:
  automerge:
    description: "Whether the upgrades are safe to automerge ('true' or 'false')"
    value: ${{ steps.evaluate.outputs.automerge }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        working-directory: ${{ github.action_path }}

    - name: Evaluate automerge
      id: evaluate
      working-directory: ${{ github.action_path }}
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RULES: ${{ inputs.rules }}
        STACK_SEVERITIES: ${{ inputs.stack-severities }}
      run: |
        commit_message="$(gh api "repos/$GH_REPO/commits/$COMMIT_SHA" --jq '.commit.message')"
        automerge="$(uv run evaluate_automerge.py --commit-message "$commit_message" --rules "$RULES" --stack-severities "$STACK_SEVERITIES")"
        echo "automerge=$automerge" >> "$GITHUB_OUTPUT"
