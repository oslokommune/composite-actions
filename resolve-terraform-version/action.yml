name: "Resolve Terraform version"
description: "Translate the required_version constraints of a Terraform configuration into a version range for hashicorp/setup-terraform, skipping releases on a central deny list"

inputs:
  working-directory:
    description: "Terraform configuration directory to read `required_version` from (e.g., `stacks/dev/app-km`)"
    required: false
    default: "."
  use-denylist:
    description: "Whether to skip Terraform releases listed in `resolve-terraform-version/denylist.json` on the main branch of this repository. The list is fetched at run time and ignored with a warning if it can't be read."
    required: false
    default: "true"

outputs:
  terraform-version:
    description: "An npm semver range that allows the same Terraform releases as the constraints, for the `terraform_version` input of `hashicorp/setup-terraform` (e.g., `>=1.9.0 <1.10.0`)"
    value: ${{ steps.resolve.outputs.terraform-version }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Download deny list
      # NOTE: Read from main, not the action ref, so changes apply to every caller right away.
      # If the download fails, the resolver warns and resolves without the deny list.
      if: inputs.use-denylist == 'true'
      continue-on-error: true
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -H "Accept: application/vnd.github.raw" \
          "repos/oslokommune/composite-actions/contents/resolve-terraform-version/denylist.json?ref=main" \
          > "$RUNNER_TEMP/terraform-version-denylist.json"

    - name: Resolve Terraform version
      # NOTE: setup-terraform evaluates version constraints with npm semver, which doesn't
      # understand Terraform's `~>` and `!=` operators. Translate the constraints to an
      # npm semver range, and let setup-terraform pick the newest release in it.
      id: resolve
      shell: bash --noprofile --norc -euo pipefail {0}
      working-directory: ${{ inputs.working-directory }}
      env:
        RESOLVER_DIR: ${{ github.action_path }}
        DENYLIST: ${{ inputs.use-denylist == 'true' && format('{0}/terraform-version-denylist.json', runner.temp) || '' }}
      run: |
        range="$(go run -C "$RESOLVER_DIR" . -dir "$PWD" -denylist "$DENYLIST")"
        echo "terraform-version=$range" >> "$GITHUB_OUTPUT"
