name: "Resolve Terraform version"
description: "Convert the required_version constraints of a Terraform configuration to a version range for setup-terraform, excluding releases on a central deny list"

inputs:
  working-directory:
    description: "Terraform configuration directory to read `required_version` from (e.g., `stacks/dev/app-km`)"
    required: false
    default: "."
  use-denylist:
    description: "Whether to exclude Terraform releases listed in `resolve-terraform-version/denylist.json` on the main branch of this repository. The list is fetched at run time and ignored with a warning if it can't be read."
    required: false
    default: "true"

outputs:
  terraform-version:
    description: "An npm semver range for the `terraform_version` input of `hashicorp/setup-terraform` (e.g., `>=1.9.0 <1.10.0 <1.9.3 || >=1.9.0 <1.10.0 >1.9.3`)"
    value: ${{ steps.resolve.outputs.terraform-version }}

runs:
  using: composite
  steps:
    - name: Download deny list
      # NOTE: Read from main, not the action ref, so changes apply to every caller right away.
      # If the download fails, the resolver warns and resolves without the deny list.
      if: inputs.use-denylist == 'true'
      continue-on-error: true
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -H "Accept: application/vnd.github.raw" \
          "repos/oslokommune/composite-actions/contents/resolve-terraform-version/denylist.json?ref=main" \
          > "$RUNNER_TEMP/terraform-version-denylist.json"

    - name: Resolve Terraform version
      # NOTE: setup-terraform evaluates version constraints with npm semver, which reads
      # Terraform's `~>`, `!=` and commas differently. Rewrite the constraints to an npm
      # semver range that allows the same releases.
      id: resolve
      shell: bash --noprofile --norc -euo pipefail {0}
      working-directory: ${{ inputs.working-directory }}
      env:
        RESOLVER: ${{ github.action_path }}/resolve_terraform_version.py
        DENYLIST: ${{ inputs.use-denylist == 'true' && format('{0}/terraform-version-denylist.json', runner.temp) || '' }}
      run: |
        version="$(python3 "$RESOLVER" --dir "$PWD" --denylist "$DENYLIST")"
        echo "Terraform version range: $version"
        echo "terraform-version=$version" >> "$GITHUB_OUTPUT"
