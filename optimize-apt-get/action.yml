name: Optimize apt (Advanced Packaging Tool)
description: Disables unnecessary apt features to optimize installation performance.

runs:

  using: composite

  steps:

    - name: Disable initramfs update
      # Ubuntu 26.04 uses dracut instead of initramfs-tools, so the file is not always there
      run: |
        if [ -f /etc/initramfs-tools/update-initramfs.conf ]; then
          sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf
        fi
      shell: bash


    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update
      shell: bash


    - name: Disable fontconfig trigger
      run: |
        if [ -f /var/lib/dpkg/triggers/File ]; then
          sudo sed '/fontconfig/d' -i /var/lib/dpkg/triggers/File
        fi
      shell: bash


    - name: Disable install-info trigger
      run: |
        if [ -f /var/lib/dpkg/triggers/File ]; then
          sudo sed '/install-info/d' -i /var/lib/dpkg/triggers/File
        fi
      shell: bash


    - name: Disable mime related triggers
      run: |
        if [ -f /var/lib/dpkg/triggers/File ]; then
          sudo sed '/mime/d' -i /var/lib/dpkg/triggers/File
        fi
      shell: bash


    - name: Disable hicolor icon theme triggers
      run: |
        if [ -f /var/lib/dpkg/triggers/File ]; then
          sudo sed '/hicolor-icon-theme/d' -i /var/lib/dpkg/triggers/File
        fi
      shell: bash
