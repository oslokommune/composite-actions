name: Release

on:

  workflow_dispatch:

  push:

    branches:
      - main

    paths:
      - "disallow-same-approver/*"
      - "optimize-apt-get/*"
      - "verify-created-release/*"
      - "delete-release/*"
      - "ecs-update-and-deploy-task-definition/*"
      - "setup-boilerplate/*"
      - "setup-ok/*"
      - "renovate-metadata/*"
      - "terraform-deploy/*"
      - "generate-tag/*"
      - "package-and-upload-artifact/*"
      - "determine-stacks/*"
      - "detect-stale-job/*"
      - "evaluate-automerge/*"


jobs:

  release-please:

    name: Run release-please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: r


      - if: ${{ steps.r.outputs.releases_created }}
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - if: ${{ steps.r.outputs.releases_created }}
        name: Import okctl-bot GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY_FOR_MACHINE_USER }}
          passphrase: ${{ secrets.GPG_PASSPHRASE_FOR_MACHINE_USER }}

          # Username and email is inferred from GPG key metadata
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
